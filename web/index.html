<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panasonic LUMIX | Camera Manual Assistant</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark" data-app-brand-mark aria-hidden="true">PL</div>
      <div>
        <p class="eyebrow" data-app-name>Camera Manual Assistant</p>
        <h1 data-app-brand-name>Panasonic LUMIX</h1>
      </div>
      <div class="header-status">
        <label class="brand-picker">
          <span>Brand</span>
          <select data-brand-select aria-label="브랜드 선택"></select>
        </label>
        <span>Hybrid RAG</span>
        <span>Source pages</span>
      </div>
    </header>
    <main class="app-shell">
      <aside class="filters" aria-label="모델 선택">
        <details id="filter-shell" class="filter-shell" open>
          <summary>
            <span>
              <strong>모델 선택</strong>
            </span>
            <span id="filter-summary">전체 모델</span>
          </summary>
          <div class="filter-body">
            <button id="clear-models" class="text-button" type="button">
              선택 초기화
            </button>
            <div id="model-list" class="model-list" aria-live="polite">
              <p class="status-line">모델 목록 로딩 중...</p>
            </div>
          </div>
        </details>
      </aside>
      <section class="search-panel">
        <form id="search-form">
          <div class="search-copy">
            <p class="eyebrow">Manual search</p>
            <label for="query">기능 검색</label>
          </div>
          <div class="search-row">
            <input
              id="query"
              name="query"
              type="search"
              autocomplete="off"
              placeholder="예: 초점, 배터리, Wi-Fi"
            />
            <select id="top-k" name="top_k" aria-label="화면 표시 수">
              <option value="8">8개</option>
              <option value="12">12개</option>
              <option value="20" selected>20개</option>
              <option value="50">50개</option>
              <option value="100">100개</option>
              <option value="200">200개</option>
            </select>
            <button type="submit">Search</button>
          </div>
          <div class="suggestion-row" aria-label="빠른 검색어">
            <button type="button" data-query="초점">초점</button>
            <button type="button" data-query="배터리">배터리</button>
            <button type="button" data-query="Wi-Fi">Wi-Fi</button>
          </div>
          <div id="context-search-panel" class="context-search-panel" hidden></div>
        </form>
        <div id="results" class="results" aria-live="polite"></div>
      </section>
      <aside class="pdf-preview-panel" aria-label="선택한 PDF 페이지">
        <div class="panel-heading">
          <p class="eyebrow">Source preview</p>
          <h2>PDF 미니맵</h2>
        </div>
        <div id="pdf-preview" class="pdf-preview">
          <p class="status-line">카드를 선택하면 PDF 페이지가 표시됩니다.</p>
        </div>
      </aside>
    </main>
    <script type="module" src="/assets/js/app_config.js?v=brand-service"></script>
    <script type="module" src="/assets/js/app.js?v=pagination-cleanup"></script>
    <script type="module" src="/assets/js/card_rewrite.js?v=brand-service"></script>
  </body>
</html>
