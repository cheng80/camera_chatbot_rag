<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1650" viewBox="0 0 1100 1650" role="img" aria-labelledby="title desc">
  <title id="title">Source-Verified Camera Manual Search Architecture</title>
  <desc id="desc">Portrait source diagram for the Camera Manual Assistant report. The raster report image is generated from this content with imagegen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF5F8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#116466"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2545" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F5FA8"/>
    </marker>
    <style>
      text { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', Arial, sans-serif; }
      .title { font-size: 46px; font-weight: 800; fill:#0B2545; }
      .subtitle { font-size: 29px; font-weight: 700; fill:#116466; }
      .card-title { font-size: 34px; font-weight: 800; fill:#0B2545; }
      .ko { font-size: 25px; font-weight: 700; fill:#116466; }
      .body { font-size: 23px; fill:#334155; }
      .small { font-size: 19px; fill:#475569; }
    </style>
  </defs>
  <rect width="1100" height="1650" fill="url(#bg)"/>
  <rect x="54" y="42" width="992" height="160" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="550" y="96" text-anchor="middle" class="title">Source-Verified Camera Manual Search</text>
  <text x="550" y="144" text-anchor="middle" class="subtitle">공식 PDF 출처 검증형 기능 검색 아키텍처</text>
  <text x="550" y="182" text-anchor="middle" class="small">Hybrid RAG · Feature Wiki · Graph-lite · PDF Viewer</text>

  <g filter="url(#shadow)">
    <rect x="70" y="245" width="960" height="190" rx="22" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
    <circle cx="125" cy="306" r="36" fill="#0B2545"/>
    <text x="125" y="319" text-anchor="middle" font-size="33" font-weight="800" fill="#FFFFFF">1</text>
    <text x="178" y="300" class="card-title">질문 정규화</text>
    <text x="178" y="337" class="ko">Query Normalization</text>
    <text x="178" y="392" class="body">모델 별칭, 오타, 붙여쓰기, 기능어를 정리해 검색 가능한 질의로 바꾼다.</text>
  </g>
  <line x1="550" y1="440" x2="550" y2="505" stroke="#0F5FA8" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="520" width="960" height="205" rx="22" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
    <circle cx="125" cy="581" r="36" fill="#116466"/>
    <text x="125" y="594" text-anchor="middle" font-size="33" font-weight="800" fill="#FFFFFF">2</text>
    <text x="178" y="575" class="card-title">하이브리드 검색</text>
    <text x="178" y="612" class="ko">SQLite FTS5 BM25 · Trigram · Section 후보</text>
    <text x="178" y="667" class="body">빠른 기준 검색을 유지하고, 섹션 후보는 Feature Wiki와 vector 실험 입력으로 쓴다.</text>
  </g>
  <line x1="550" y1="730" x2="550" y2="795" stroke="#0F5FA8" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="810" width="960" height="220" rx="22" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
    <circle cx="125" cy="871" r="36" fill="#0F5FA8"/>
    <text x="125" y="884" text-anchor="middle" font-size="33" font-weight="800" fill="#FFFFFF">3</text>
    <text x="178" y="865" class="card-title">기능 위키 + Graph-lite</text>
    <text x="178" y="902" class="ko">Feature labels · aliases · model-document-page relations</text>
    <text x="178" y="957" class="body">자연어 기능 질문에는 검증된 기능 후보와 관계 정보를 더해 검색 누락을 줄인다.</text>
    <text x="178" y="995" class="small">Neo4j는 아직 도입하지 않고 JSON graph-lite로 검증한다.</text>
  </g>
  <line x1="550" y1="1035" x2="550" y2="1100" stroke="#0F5FA8" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="1115" width="960" height="205" rx="22" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
    <circle cx="125" cy="1176" r="36" fill="#2F855A"/>
    <text x="125" y="1189" text-anchor="middle" font-size="33" font-weight="800" fill="#FFFFFF">4</text>
    <text x="178" y="1170" class="card-title">출처 검증</text>
    <text x="178" y="1207" class="ko">document_id · model_id · page · viewer URL</text>
    <text x="178" y="1262" class="body">공식 PDF 페이지와 모델 범위가 확인된 후보만 기능 카드로 승격한다.</text>
  </g>
  <line x1="550" y1="1325" x2="550" y2="1390" stroke="#0F5FA8" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="1405" width="960" height="155" rx="22" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
    <circle cx="125" cy="1466" r="36" fill="#6B46C1"/>
    <text x="125" y="1479" text-anchor="middle" font-size="33" font-weight="800" fill="#FFFFFF">5</text>
    <text x="178" y="1460" class="card-title">기능 카드 + PDF 뷰어</text>
    <text x="178" y="1497" class="ko">deterministic card_template · 4x page image · OpenSeadragon</text>
    <text x="178" y="1540" class="body">LLM은 선택 카드의 짧은 문장 보정에만 사용한다.</text>
  </g>
  <rect x="70" y="1587" width="960" height="72" rx="20" fill="url(#navy)"/>
  <text x="550" y="1632" text-anchor="middle" font-size="29" font-weight="800" fill="#FFFFFF">검색·출처 판단은 파이프라인, 문장 보정만 LLM</text>
</svg>
