<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700">
  <rect width="1200" height="1700" fill="#F7F9FA"/>
  <rect x="64" y="52" width="1072" height="150" rx="24" fill="#EEF7F7"/>
  <text x="96" y="116" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="42" font-weight="700" fill="#0B2545">Source-Verified Camera Manual Search</text>
  <text x="96" y="164" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" fill="#116466">공식 PDF 출처 검증형 기능 검색 아키텍처</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 z" fill="#2C7A7B"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0B2545" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <g filter="url(#shadow)">
      <rect x="110" y="270" width="980" height="205" rx="24" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
      <circle cx="180" cy="335" r="42" fill="#116466"/>
      <text x="180" y="349" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">1</text>
      <text x="250" y="326" font-size="34" font-weight="700" fill="#0B2545">Query Normalization</text>
      <text x="250" y="368" font-size="25" fill="#344054">사용자 질문을 검색 가능한 표현으로 정리</text>
      <text x="250" y="421" font-size="23" fill="#5F6B7A">모델명/별칭 · 오타 · 붙여쓰기 · 검색 제어어 보정</text>
    </g>

    <line x1="600" y1="486" x2="600" y2="565" stroke="#2C7A7B" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="110" y="585" width="980" height="245" rx="24" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
      <circle cx="180" cy="650" r="42" fill="#2C7A7B"/>
      <text x="180" y="664" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">2</text>
      <text x="250" y="641" font-size="34" font-weight="700" fill="#0B2545">Hybrid Retrieval</text>
      <text x="250" y="683" font-size="25" fill="#344054">로컬 색인에서 후보 페이지와 기능 문맥 검색</text>
      <rect x="250" y="720" width="230" height="62" rx="16" fill="#EEF7F7"/>
      <text x="365" y="759" text-anchor="middle" font-size="22" font-weight="700" fill="#116466">SQLite FTS5</text>
      <rect x="505" y="720" width="210" height="62" rx="16" fill="#EEF7F7"/>
      <text x="610" y="759" text-anchor="middle" font-size="22" font-weight="700" fill="#116466">Trigram</text>
      <rect x="740" y="720" width="255" height="62" rx="16" fill="#F2F4F7"/>
      <text x="867" y="759" text-anchor="middle" font-size="22" font-weight="700" fill="#5F6B7A">Optional Vector</text>
    </g>

    <line x1="600" y1="842" x2="600" y2="921" stroke="#2C7A7B" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="110" y="940" width="980" height="230" rx="24" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
      <circle cx="180" cy="1005" r="42" fill="#0F5FA8"/>
      <text x="180" y="1019" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">3</text>
      <text x="250" y="996" font-size="34" font-weight="700" fill="#0B2545">Source Validation</text>
      <text x="250" y="1038" font-size="25" fill="#344054">공식 PDF 근거와 모델 범위를 검증</text>
      <text x="250" y="1094" font-size="23" fill="#5F6B7A">document_id · model_id · page · viewer URL 계약 확인</text>
      <text x="250" y="1132" font-size="23" fill="#5F6B7A">source ref 없는 정보는 확정 답변으로 사용하지 않음</text>
    </g>

    <line x1="600" y1="1182" x2="600" y2="1261" stroke="#2C7A7B" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="110" y="1280" width="980" height="250" rx="24" fill="#FFFFFF" stroke="#B7D6E6" stroke-width="3"/>
      <circle cx="180" cy="1345" r="42" fill="#0B2545"/>
      <text x="180" y="1359" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">4</text>
      <text x="250" y="1336" font-size="34" font-weight="700" fill="#0B2545">Feature Card + PDF Viewer</text>
      <text x="250" y="1378" font-size="25" fill="#344054">deterministic card_template로 답변 카드 생성</text>
      <rect x="250" y="1420" width="330" height="66" rx="16" fill="#EEF7F7"/>
      <text x="415" y="1462" text-anchor="middle" font-size="22" font-weight="700" fill="#116466">기능 카드</text>
      <rect x="615" y="1420" width="350" height="66" rx="16" fill="#EEF7F7"/>
      <text x="790" y="1462" text-anchor="middle" font-size="22" font-weight="700" fill="#116466">PDF 원문 페이지 확인</text>
    </g>

    <rect x="150" y="1588" width="900" height="68" rx="20" fill="#0B2545"/>
    <text x="600" y="1631" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">LLM은 검색/출처 판단이 아니라 선택 카드의 짧은 문장 보정에만 사용</text>
  </g>
</svg>
