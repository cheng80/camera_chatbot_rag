[project]
name = "camera-chatbot-rag"
version = "0.1.0"
description = "Camera manual assistant with FastAPI-served static UI and Hybrid RAG."
readme = "README.md"
requires-python = ">=3.12.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "orjson>=3.10",
    "pymupdf>=1.24",
    "pdf2image>=1.17",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "httpx2>=0.28",
]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "opendataloader-pdf>=2.4.7",
    "PyYAML>=6.0",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "uv>=0.8",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["backend/app", "backend/tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend/app", "backend/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "CPY001",
    "D",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"scripts/**/*.py" = ["T201", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
pythonpath = ["."]
